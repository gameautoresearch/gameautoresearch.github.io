[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polytopia-bot"
version = "0.1.0"
description = "GPU-native Polytopia simulation and language-policy research"
requires-python = ">=3.11"
dependencies = ["jax==0.11.2", "numpy>=2.1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
cuda = ["jax[cuda12]==0.11.2; sys_platform == 'linux'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polytopia_bot.gpu" = ["rules.json"]
"polytopia_bot.studio" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
