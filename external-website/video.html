<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Autoresearch · Video</title>
    <script>
      (function () {
        const real = {
          dateNow: Date.now.bind(Date),
          perfNow: performance.now.bind(performance),
          setTimeout: window.setTimeout.bind(window),
          clearTimeout: window.clearTimeout.bind(window),
          setInterval: window.setInterval.bind(window),
          clearInterval: window.clearInterval.bind(window),
          raf: window.requestAnimationFrame.bind(window),
          caf: window.cancelAnimationFrame.bind(window),
        };
        window.__realClock = real;
        if (!new URLSearchParams(window.location.search).has("vclock")) return;

        let enabled = false;
        let vDate = 0;
        let vPerf = 0;
        let nextId = 100000;
        const timers = new Map();
        const rafs = new Map();

        Date.now = function () {
          return enabled ? Math.round(vDate) : real.dateNow();
        };
        performance.now = function () {
          return enabled ? vPerf : real.perfNow();
        };
        window.setTimeout = function (fn, delay, ...args) {
          if (!enabled) return real.setTimeout(fn, delay, ...args);
          const id = nextId++;
          timers.set(id, { id, fn, args, at: vPerf + Math.max(0, Number(delay) || 0), interval: 0 });
          return id;
        };
        window.clearTimeout = function (id) {
          if (timers.has(id)) timers.delete(id);
          else real.clearTimeout(id);
        };
        window.setInterval = function (fn, delay, ...args) {
          if (!enabled) return real.setInterval(fn, delay, ...args);
          const id = nextId++;
          const step = Math.max(1, Number(delay) || 1);
          timers.set(id, { id, fn, args, at: vPerf + step, interval: step });
          return id;
        };
        window.clearInterval = function (id) {
          if (timers.has(id)) timers.delete(id);
          else real.clearInterval(id);
        };
        window.requestAnimationFrame = function (fn) {
          if (!enabled) return real.raf(fn);
          const id = nextId++;
          rafs.set(id, fn);
          return id;
        };
        window.cancelAnimationFrame = function (id) {
          if (rafs.has(id)) rafs.delete(id);
          else real.caf(id);
        };

        function flushDue() {
          for (let guard = 0; guard < 200; guard++) {
            let earliest = null;
            for (const t of timers.values()) {
              if (t.at <= vPerf && (!earliest || t.at < earliest.at)) earliest = t;
            }
            if (!earliest) break;
            if (earliest.interval > 0) earliest.at += earliest.interval;
            else timers.delete(earliest.id);
            try {
              if (typeof earliest.fn === "function") earliest.fn(...earliest.args);
            } catch (e) {
              console.error(e);
            }
          }
        }

        window.__vclock = {
          enable() {
            if (enabled) return;
            vDate = real.dateNow();
            vPerf = real.perfNow();
            enabled = true;
          },
          disable() {
            enabled = false;
            timers.clear();
            rafs.clear();
          },
          advance(dtMs) {
            if (!enabled) return;
            const steps = Math.max(1, Math.ceil(dtMs / 16));
            const sub = dtMs / steps;
            for (let s = 0; s < steps; s++) {
              vDate += sub;
              vPerf += sub;
              flushDue();
              const batch = Array.from(rafs.entries());
              rafs.clear();
              for (const [, fn] of batch) {
                try {
                  fn(vPerf);
                } catch (e) {
                  console.error(e);
                }
              }
              flushDue();
            }
          },
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/video/main.tsx"></script>
  </body>
</html>
